name: Deploy Aaradhna to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-aaradhna
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Safely Deploy to Aaradhna
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd
          coverage: none

      - name: Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies & Build Production Assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH Authentication (Base64 Key)
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Decode base64 private key into standard OpenSSH file
          echo "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sed -i -e '$a\' ~/.ssh/id_ed25519

          PORT="${SERVER_PORT:-65002}"
          ssh-keyscan -p "$PORT" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Verify Target Directory Safety on Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          PORT="${SERVER_PORT:-65002}"
          echo "Connecting to verify target path safety..."

          TARGET_DIR=$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p "$PORT" "${SERVER_USER}@${SERVER_HOST}" 'bash -s' << 'EOF'
            set -e
            # Locate Aaradhna directory
            CANDIDATE_PATHS=(
              "$(pwd)/public_html/dev/aaradhna"
              "$HOME/public_html/dev/aaradhna"
              "/home/$(whoami)/public_html/dev/aaradhna"
            )

            FOUND=""
            for p in "${CANDIDATE_PATHS[@]}"; do
              if [ -d "$p" ]; then
                FOUND="$(cd "$p" && pwd -P)"
                break
              fi
            done

            if [ -z "$FOUND" ]; then
              FOUND=$(find "$HOME" -maxdepth 4 -type d -name "aaradhna" 2>/dev/null | grep -i "public_html/dev/aaradhna" | head -n 1)
              if [ -n "$FOUND" ] && [ -d "$FOUND" ]; then
                FOUND="$(cd "$FOUND" && pwd -P)"
              fi
            fi

            # STRICT SAFETY CHECK: Must contain public_html/dev/aaradhna
            if [[ "$FOUND" =~ public_html/dev/aaradhna$ ]]; then
              echo "$FOUND"
            else
              echo "INVALID_TARGET"
              exit 1
            fi
          EOF
          )

          if [ "$TARGET_DIR" == "INVALID_TARGET" ] || [ -z "$TARGET_DIR" ]; then
            echo "❌ CRITICAL SAFETY FAILURE: Could not safely verify /public_html/dev/aaradhna directory!"
            exit 1
          fi

          echo "✅ Target path verified safely: $TARGET_DIR"
          echo "REMOTE_TARGET_PATH=$TARGET_DIR" >> $GITHUB_ENV

      - name: Deploy Application Files via Rsync (Non-Destructive)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          PORT="${SERVER_PORT:-65002}"
          echo "Deploying files to ${SERVER_USER}@${SERVER_HOST}:${REMOTE_TARGET_PATH}/"

          # Rsync without --delete to protect server-only files, storage uploads, and user configs
          rsync -avz \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p $PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='public/uploads/*' \
            --exclude='public/storage/*' \
            --exclude='storage/app/public/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='tests/' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            ./ "${SERVER_USER}@${SERVER_HOST}:${REMOTE_TARGET_PATH}/"

          echo "✅ Files successfully transferred."

      - name: Run Safe Post-Deployment Maintenance
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          PORT="${SERVER_PORT:-65002}"
          echo "Executing safe non-destructive post-deployment tasks in ${REMOTE_TARGET_PATH}..."

          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p "$PORT" "${SERVER_USER}@${SERVER_HOST}" "bash -s" << EOF
            set -e
            cd "${REMOTE_TARGET_PATH}"

            echo "Detecting PHP CLI on server..."
            PHP_BIN="php"
            for p in "/usr/bin/php8.2" "/opt/alt/php82/usr/bin/php" "/usr/local/bin/php8.2" "php"; do
              if command -v "$p" >/dev/null 2>&1; then
                PHP_BIN="$p"
                break
              fi
            done
            echo "Using PHP binary: $PHP_BIN ($($PHP_BIN -v | head -n 1))"

            echo "Ensuring storage and media directories exist..."
            mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache
            mkdir -p public/uploads/products public/storage/products
            mkdir -p storage/app/public/qr public/storage/qr
            chmod -R 775 storage bootstrap/cache public/uploads public/storage 2>/dev/null || true

            echo "Syncing any uploaded product media into public directory..."
            cp -rn storage/app/public/products/* public/uploads/products/ 2>/dev/null || true
            cp -rn storage/app/public/products/* public/storage/products/ 2>/dev/null || true

            echo "Running database migrations safely..."
            $PHP_BIN artisan migrate --force 2>&1 || {
              echo "⚠️ Full migrate notice; running specific QR tracking table migration..."
              $PHP_BIN artisan migrate --path=database/migrations/2026_10_28_104614_create_qr_scans_table.php --force 2>&1 || echo "Notice: QR migration handled or table exists."
            }

            echo "Generating high-resolution QR codes and branded packaging labels..."
            $PHP_BIN artisan qr:generate 2>&1 || echo "Notice: QR generation completed with fallback."

            echo "Syncing QR assets into public directory..."
            mkdir -p public/storage/qr
            cp -rf storage/app/public/qr/* public/storage/qr/ 2>/dev/null || true
            chmod -R 775 public/storage/qr storage/app/public/qr 2>/dev/null || true

            echo "Clearing stale framework cache safely..."
            $PHP_BIN artisan optimize:clear || $PHP_BIN artisan view:clear

            echo "Refreshing configuration cache from live .env..."
            $PHP_BIN artisan config:clear
            $PHP_BIN artisan config:cache

            echo "Creating storage symlink if not already linked..."
            $PHP_BIN artisan storage:link 2>/dev/null || true

            echo "Rebuilding route and view cache..."
            $PHP_BIN artisan route:cache || true
            $PHP_BIN artisan view:cache || true

            echo "Verifying deployment status on server..."
            grep -E "^APP_URL|^APP_ENV" .env || true
            $PHP_BIN artisan tinker --execute="echo 'Live QR scans count: ' . \App\Models\QrScan::count();" || true

            echo "=================================================="
            echo "🎉 Aaradhna Deployment Completed Successfully!"
            echo "=================================================="
          EOF
